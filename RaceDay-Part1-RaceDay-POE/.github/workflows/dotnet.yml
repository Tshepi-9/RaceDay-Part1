name: RaceDay CI/CD

on:
  push:
    branches:
      - RaceDay-Part3
  pull_request:
    branches:
      - RaceDay-Part3

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Dependencies
        run: dotnet restore RaceDay.Api.slnx

      - name: Build Solution
        run: dotnet build RaceDay.Api.slnx --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test RaceDay.Api.slnx --configuration Release --no-build --verbosity normal